[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
# Coverage is measured on every gate run. The baseline gate prevents
# regression while the integration's 95% target is tracked as release work.
addopts = --cov=custom_components.leassh --cov-report=term-missing --cov-fail-under=45
