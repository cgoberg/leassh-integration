[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
# Coverage is measured on every gate run. The baseline gate prevents
# regression while the 95% quality-scale target is enforced.
addopts = --cov=custom_components.leassh --cov-report=term-missing --cov-fail-under=95
