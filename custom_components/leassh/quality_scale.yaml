# Home Assistant integration quality scale — current rule set (54 rules).
#
# Source: developers.home-assistant.io/core/quality-scale (checked 2026-10-28).
# A tier needs every rule of that tier and every tier below it. `exempt` is
# used only where the rule cannot apply; `todo` is an explicit gap.
rules:
  # --- Bronze (20) ------------------------------------------------------
  action-setup:
    status: exempt
    comment: No custom actions are registered; notify.leassh is an entity service.
  appropriate-polling:
    status: done
  brands:
    status: done
  common-modules:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
    comment: No runtime PyPI dependencies; aiohttp comes from HA.
  docs-actions:
    status: exempt
    comment: No custom actions beyond the notify entity, which is documented.
  docs-conditions:
    status: exempt
    comment: The integration exposes no conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
    comment: README "Removal" covers entry, add-on/container and persistent data.
  docs-triggers:
    status: exempt
    comment: No device triggers; leassh_event is documented for automations.
  entity-event-setup:
    status: exempt
    comment: Entities are CoordinatorEntity instances; the entry owns one listener and unloads it with the entry.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: Runtime is stored on ConfigEntry.runtime_data and cleared on unload.
  test-before-configure:
    status: done
  test-before-setup:
    status: done
  unique-config-entry:
    status: done

  # --- Silver (10) ------------------------------------------------------
  action-exceptions:
    status: done
    comment: Button failures raise HomeAssistantError with exceptions.action_failed and placeholders.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
    comment: README documents notify_targets and where recipe parameters are configured.
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES is explicit on sensor, binary_sensor, button and notify platforms.
  reauthentication-flow:
    status: done
  test-coverage:
    status: done
    comment: pytest-cov runs on every gate with a 95% threshold; the suite covers API, notify, WS, coordinator, repairs, platforms, setup and config/options flows.

  # --- Gold (21) --------------------------------------------------------
  devices:
    status: done
  diagnostics:
    status: done
  discovery:
    status: done
    comment: _leassh._tcp zeroconf discovery exists.
  discovery-update-info:
    status: done
    comment: Zeroconf rediscovery updates the existing entry's server_url.
  docs-data-update:
    status: done
    comment: README "Data updates" documents the 30 s ETag poll plus WS events and reconciliation.
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
    comment: README "Known limitations" documents sampler identity, Windows presence, containers and live-action requirements.
  docs-supported-devices:
    status: done
    comment: README "Supported devices" lists Linux/Windows/macOS SSH hosts and pack tool prerequisites.
  docs-supported-functions:
    status: done
    comment: README "Supported functions" covers entities/series, actions, claims, recipes, notify and events.
  docs-troubleshooting:
    status: done
    comment: README "Troubleshooting" links the server troubleshooting guide and lists first checks.
  docs-use-cases:
    status: done
    comment: README "Use cases" covers homelab, family, SMB/fleet and virtualization.
  dynamic-devices:
    status: done
  entity-category:
    status: done
    comment: Suggested packs and license sensors are EntityCategory.DIAGNOSTIC.
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: Suggested packs is disabled by default; core health entities stay enabled.
  entity-translations:
    status: done
  exception-translations:
    status: done
    comment: exceptions.action_failed is in strings.json/translations and used by buttons.
  icon-translations:
    status: done
    comment: icons.json carries entity icons for buttons and translated sensors.
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
  stale-devices:
    status: done

  # --- Platinum (3) — not required for gold -----------------------------
  async-dependency:
    status: exempt
    comment: No external client library; aiohttp is supplied by Home Assistant.
  inject-websession:
    status: done
  strict-typing:
    status: done
    comment: py.typed and mypy.ini are shipped; tests/test_typing.py runs mypy on every pytest gate.
